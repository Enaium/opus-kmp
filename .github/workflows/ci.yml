# Managed in the repository; see README for publishing requirements.
name: Test

# Manual only: the workflow is never started by a push or pull request.
"on":
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test macOS (JVM + Apple + web)
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Check out the Opus submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"

      - name: Publish macOS, JVM and web artifacts to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          :opus-kmp:publishToMavenLocal
          -x :opus-kmp:publishAndroidPublicationToMavenLocal
          -x :opus-kmp:publishLinuxX64PublicationToMavenLocal
          -x :opus-kmp:publishLinuxArm64PublicationToMavenLocal
          -x :opus-kmp:publishMingwX64PublicationToMavenLocal
          -x :opus-kmp:publishAndroidNativeArm64PublicationToMavenLocal
          -x :opus-kmp:publishAndroidNativeArm32PublicationToMavenLocal
          -x :opus-kmp:publishAndroidNativeX64PublicationToMavenLocal
          -x :opus-kmp:publishAndroidNativeX86PublicationToMavenLocal
          :jni-jvm-darwin-aarch64:publishToMavenLocal
          :jni-jvm-darwin-x86_64:publishToMavenLocal

      - name: Run JVM, native and web tests
        run: >
          ./gradlew --no-daemon --stacktrace
          :opus-kmp:jvmTest
          :opus-kmp:macosArm64Test
          :opus-kmp:jsNodeTest
          :opus-kmp:wasmJsNodeTest

      - name: Compile the remaining macOS target
        run: ./gradlew --no-daemon --stacktrace :opus-kmp:compileKotlinMacosX64

      - name: Build and run the visual example headless
        run: |
          ./gradlew --no-daemon --stacktrace :examples:visual:linkDebugExecutableMacosArm64
          SDL_VIDEO_DRIVER=dummy OPUS_KMP_FRAMES=30 \
            ./examples/visual/build/bin/macosArm64/debugExecutable/visual.kexe
          # The stereo path is the one that used to index past the frame buffer.
          SDL_VIDEO_DRIVER=dummy OPUS_KMP_FRAMES=30 OPUS_KMP_CHANNELS=2 \
            ./examples/visual/build/bin/macosArm64/debugExecutable/visual.kexe

      - name: Stage and verify the @enaium/opus-kmp npm package
        run: |
          ./gradlew --no-daemon --stacktrace :opus-kmp:assembleWasmNpm
          cd opus-kmp/build/npm
          node --input-type=module -e "
            import { readFile } from 'node:fs/promises';
            import { initOpusKmp } from './opus_kmp_glue.js';
            const bytes = await readFile('./opus_wasm.wasm');
            const opus = await initOpusKmp(bytes);
            console.log('npm package version:', opus.versionString());
          "
          npm pack --dry-run

  test-linux:
    name: Test Linux (JVM + Linux + cross + Android)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Check out the Opus submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "platforms;android-37.1" "ndk;27.0.12077973" >/dev/null

      - name: Publish Linux, Android, MinGW and JNI artifacts to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          :opus-kmp:publishLinuxX64PublicationToMavenLocal
          :opus-kmp:publishLinuxArm64PublicationToMavenLocal
          :opus-kmp:publishMingwX64PublicationToMavenLocal
          :opus-kmp:publishAndroidPublicationToMavenLocal
          :opus-kmp:publishAndroidNativeArm64PublicationToMavenLocal
          :opus-kmp:publishAndroidNativeArm32PublicationToMavenLocal
          :opus-kmp:publishAndroidNativeX64PublicationToMavenLocal
          :opus-kmp:publishAndroidNativeX86PublicationToMavenLocal
          :jni-jvm-linux-x86_64:publishToMavenLocal
          :jni-jvm-linux-aarch64:publishToMavenLocal

      - name: Run JVM, Linux, Android host and cross-target tests
        run: >
          ./gradlew --no-daemon --stacktrace
          :opus-kmp:jvmTest
          :opus-kmp:linuxX64Test
          :opus-kmp:testAndroidHostTest
          :opus-kmp:linkDebugTestMingwX64
          :opus-kmp:linkDebugTestLinuxArm64
          :opus-kmp:compileKotlinLinuxArm64
          --continue

      - name: Build the Android JNI library, AAR and static archives
        run: >
          ./gradlew --no-daemon --stacktrace
          :opus-kmp:bundleAndroidMainAar
          :opus-kmp:buildAndroidJniLibs
          :opus-kmp:buildNative_linuxX64
          :opus-kmp:buildNative_linuxArm64
          :opus-kmp:buildNative_mingwX64

      - name: Verify the AAR ships every ABI
        run: |
          AAR="opus-kmp/build/outputs/aar/opus-kmp.aar"
          test -f "$AAR" || { echo "FAIL: AAR missing"; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -l "$AAR" | grep -q "jni/$abi/libopus_jni.so" || {
              echo "FAIL: AAR lacks $abi libopus_jni.so"
              exit 1
            }
          done
          echo "OK: AAR ships libopus_jni.so for every ABI"

      - name: Verify the JNI library per ABI
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            lib="opus-kmp/build/jniLibs/$abi/libopus_jni.so"
            test -f "$lib" || { echo "FAIL: no JNI library for $abi"; exit 1; }
            echo "OK: $abi $(du -h "$lib" | cut -f1)"
          done

      - name: Verify the static archives
        run: |
          for target in linuxX64 linuxArm64 mingwX64; do
            archive="opus-kmp/build/native/$target/libopus_kmp.a"
            test -f "$archive" || { echo "FAIL: no static archive for $target"; exit 1; }
            echo "OK: $target $(du -h "$archive" | cut -f1)"
          done

      - name: Compile the visual example for Linux and MinGW
        run: >
          ./gradlew --no-daemon --stacktrace
          :examples:visual:compileKotlinLinuxX64
          :examples:visual:compileKotlinMingwX64

      - name: Build the Android visual example
        run: ./gradlew --no-daemon --stacktrace :examples:visual:android-app:assembleDebug

      - name: Verify the Android example APK ships the JNI libraries
        run: |
          APK="examples/visual/android/build/outputs/apk/debug/android-app-debug.apk"
          test -f "$APK" || { echo "FAIL: APK missing"; exit 1; }
          for lib in libopus_jni.so libimgui_jni.so libsdl_jni.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$lib" || {
              echo "FAIL: APK lacks arm64-v8a/$lib"
              exit 1
            }
          done
          echo "OK: APK ships every native library"

  test-windows:
    name: Test Windows (JNI + MinGW)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Check out the Opus submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Publish the Windows JNI artifact to Maven Local
        shell: pwsh
        run: >
          ./gradlew.bat --no-daemon --stacktrace
          :jni-jvm-windows-x86_64:publishToMavenLocal

      - name: Build and test the MinGW target
        shell: pwsh
        run: >
          ./gradlew.bat --no-daemon --stacktrace
          :opus-kmp:jvmTest
          :opus-kmp:mingwX64Test
          :examples:visual:linkDebugExecutableMingwX64
